<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FrankApp – Daily Threads</title>
    <link rel="stylesheet" href="src/styles.css?v=20260206-21" />
  </head>
  <body>
    <div id="lock" class="lock-overlay">
      <div class="lock-card">
        <div class="lock-title">FrankApp</div>
        <div class="lock-sub">Enter password to continue</div>
        <form id="lock-form" class="lock-form" autocomplete="off">
          <input id="lock-input" type="password" placeholder="Password" required />
          <label class="lock-remember"><input id="lock-remember" type="checkbox" /> Remember this device</label>
          <button class="btn primary" type="submit">Unlock</button>
          <div id="lock-msg" class="lock-msg" role="alert" aria-live="polite"></div>
        </form>
      </div>
    </div>
    <div id="app" hidden>
    <header class="app-header">
      <div class="brand">FrankApp</div>
      <nav class="tabs" role="tablist" aria-label="Modes">
        <button id="tab-prepare" class="tab active" role="tab" aria-selected="true">Prepare</button>
        <button id="tab-review" class="tab" role="tab" aria-selected="false">Review</button>
        <button id="tab-tasks" class="tab" role="tab" aria-selected="false">Tasks</button>
        <button id="tab-pantry" class="tab" role="tab" aria-selected="false">Pantry</button>
      </nav>
    </header>
    <section class="utility-bar" aria-label="Quick tools">
      <form id="quick-capture-form" class="quick-capture" autocomplete="off">
        <input id="quick-capture-input" type="text" placeholder="Quick capture task..." />
        <select id="quick-capture-priority" title="Capture priority">
          <option value="1">P1</option>
          <option value="2">P2</option>
          <option value="3" selected>P3</option>
          <option value="4">P4</option>
          <option value="5">P5</option>
        </select>
        <select id="quick-capture-tag" title="Capture tag"></select>
        <select id="quick-capture-target" title="Capture target"></select>
        <button class="btn primary" type="submit">Capture</button>
      </form>
      <div class="utility-actions">
        <input id="global-search" type="search" placeholder="Search threads, tasks, tags..." aria-label="Global search" />
        <button id="btn-undo" class="btn ghost" type="button" title="Undo (Cmd/Ctrl+Z)">Undo</button>
        <button id="btn-redo" class="btn ghost" type="button" title="Redo (Shift+Cmd/Ctrl+Z)">Redo</button>
      </div>
      <div id="search-results" class="search-results" hidden></div>
      <div id="quick-capture-link" class="quick-capture-link" hidden></div>
    </section>

    <main id="view-prepare" class="view active" aria-labelledby="tab-prepare">
      <section class="section">
        <div class="section-header">
          <h1>Threads</h1>
          <button id="btn-add-thread" class="btn primary">Add Thread</button>
        </div>
        <div id="threads-root" class="threads"></div>
      </section>
    </main>

    <main id="view-review" class="view" aria-labelledby="tab-review" hidden>
      <section class="section">
        <div class="section-header">
          <h1>Daily Review</h1>
          <button id="btn-start-review" class="btn primary">Start Review</button>
        </div>
        <div id="review-date" class="review-date"></div>
        <div id="review-empty" class="empty">No subthreads yet. Add some in Prepare.</div>
        <div id="review-summary" class="review-summary" hidden></div>
        <div id="review-stage" class="review-stage" hidden>
          <div id="story-progress" class="story-progress" aria-hidden="true"></div>
          <div id="story-card" class="story-card" role="region" aria-live="polite"></div>
          <div class="story-controls">
            <button id="btn-prev" class="btn ghost">Prev</button>
            <button id="btn-next" class="btn primary grow">Next</button>
          </div>
        </div>
      </section>
    </main>

    <main id="view-tasks" class="view" aria-labelledby="tab-tasks" hidden>
      <section class="section">
        <div class="section-header">
          <h1>Tasks</h1>
        </div>
        <div class="subtext">Sorted by priority (1 highest)</div>
        <div id="tasks-controls" class="tasks-controls"></div>
        <div id="tasks-root" class="tasks all"></div>
      </section>
    </main>

    <main id="view-pantry" class="view" aria-labelledby="tab-pantry" hidden>
      <section class="section">
        <div class="section-header">
          <h1>Pantry</h1>
        </div>
        <nav class="tabs" role="tablist" aria-label="Pantry Modes">
          <button id="ptab-prepare" class="tab active" role="tab" aria-selected="true">Prepare</button>
          <button id="ptab-review" class="tab" role="tab" aria-selected="false">Review</button>
          <button id="ptab-shopping" class="tab" role="tab" aria-selected="false">Shopping List</button>
        </nav>

        <div id="pantry-prepare" class="pview active">
          <div class="section-header" style="margin-top:10px;">
            <h1>Categories</h1>
            <button id="btn-add-category" class="btn primary">Add Category</button>
          </div>
          <div id="pantry-prepare-root" class="threads"></div>
        </div>

        <div id="pantry-review" class="pview" hidden>
          <div class="section-header" style="margin-top:10px;">
            <h1>Pantry Review</h1>
            <button id="btn-start-pantry-review" class="btn primary">Start Review</button>
          </div>
          <div id="pantry-review-empty" class="empty">No categories/items yet. Add some in Prepare.</div>
          <div id="pantry-review-stage" class="review-stage" hidden>
            <div id="pprogress" class="story-progress" aria-hidden="true"></div>
            <div id="pcard" class="story-card" role="region" aria-live="polite"></div>
            <div class="story-controls">
              <button id="pbtn-prev" class="btn ghost">Prev</button>
              <button id="pbtn-next" class="btn primary grow">Next</button>
            </div>
          </div>
        </div>

        <div id="pantry-shopping" class="pview" hidden>
          <div class="section-header" style="margin-top:10px;">
            <h1>Shopping List</h1>
            <button id="btn-copy-shopping" class="btn ghost" title="Copy shopping list to clipboard">Copy</button>
          </div>
          <div id="shopping-root" class="tasks all"></div>
        </div>
      </section>
    </main>

    <div id="modal" class="modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <h2 id="modal-title">Edit</h2>
          <button class="icon-btn" data-close aria-label="Close">✕</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>
    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
    </div>

    <script type="module" src="src/firebase-init.js?v=20260206-21"></script>
    <script src="src/lock.js?v=20260206-21"></script>
    <script src="src/app.js?v=20260206-21"></script>
  </body>
  </html>
